<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serinity Pyle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* Purple Header */
        header {
            background: linear-gradient(135deg, #6b46c1 0%, #9333ea 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .header-title {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Navigation Bar */
        nav {
            background-color: #5a3ca1;
            padding: 1rem 0;
            display: flex;
            justify-content: center;
            gap: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: opacity 0.3s ease, color 0.3s ease;
            padding: 0.5rem 1rem;
        }

        nav a:hover {
            opacity: 0.8;
            color: #e9d5ff;
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .section {
            margin: 2rem 0;
        }

        .section h2 {
            color: #6b46c1;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .section p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header-title">Serinity Pyle</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section class="section" id="home">
            <h2>Welcome</h2>
            <p>Welcome to my portfolio.</p>
        </section>

        <section class="section" id="about">
            <h2>About Me</h2>
            <p>Add information about yourself here.</p>
        </section>

        <section class="section" id="projects">
            <h2>Projects</h2>
            <p>Share your projects and accomplishments here.</p>
        </section>

        <section class="section" id="contact">
            <h2>Contact</h2>
            <p>Get in touch through your preferred contact method.</p>
        </section>
    </main>
</body>
</html>
